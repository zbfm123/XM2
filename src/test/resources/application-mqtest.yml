# ===================================================================
# 延迟队列集成测试专用配置（T-012 / 验收 A-06）
#
# ⚠️ 这个 profile 是**唯一需要真实 RabbitMQ 的测试配置**，
#    因此刻意与 application-test.yml 分开：
#    "干净机器 clone 下来 mvn test 就能全绿"（N-04 的一部分）不能被破坏。
#    本 profile 只在显式指定时启用，见 PaymentTimeoutIntegrationTest 的说明。
#
# 两个关键覆盖：
#   1. 把"15 分钟"压成 **2 秒** —— 否则验证"到期自动取消"要真的等 15 分钟，
#      那种测试没有人会跑。
#   2. 队列名换成 *_test 后缀 ——
#      ⚠️ TTL 是**队列属性**，一旦队列已存在就没法改。
#      用独立队列名可以让测试反复运行而不必手工删队列。
#
# ⚠️⚠️ 下面这两个数字**必须对齐**，这是踩过坑的地方：
#
#     app.appointment.payment-timeout-minutes  ->  订单的 expire_at（业务时限）
#     app.mq.payment-ttl-millis                ->  延迟队列的消息 TTL（投递延迟）
#
#   最初业务时限写的是 15（分钟），而队列 TTL 是 1 秒 —— 两者**分家**了。
#   当时测试能过，只是因为 cancelOnTimeout **根本没看 expire_at**
#   （收到消息就取消）。后来补上"到点了没有"的校验，这个不一致立刻暴露。
#
#   现在两者都取 2 秒：2/60 分钟 = 2.0 秒，与 payment-ttl-millis 一致。
# ===================================================================
spring:
  datasource:
    url: jdbc:h2:mem:hospital_mq_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      continue-on-error: false
      encoding: UTF-8

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    connection-timeout: 3s
    listener:
      simple:
        default-requeue-rejected: false
        # 测试里要尽快消费，不要等默认的 idle 间隔
        prefetch: 1

app:
  jwt:
    secret: test-only-secret-must-be-at-least-32-bytes-long
    issuer: hospital-appointment
    expire-minutes: 120
    max-failures: 5
    lock-minutes: 15
  appointment:
    # ⚠️ 2/60 = 0.033333... 分钟 = **恰好 2.0 秒**，必须与下面的 payment-ttl-millis 对齐。
    #    用分数写而不是写 0.0333 —— 后者是 1998 毫秒，差 2 毫秒，
    #    会让"两者对齐"的断言失败（这个坑已经踩过一次）。
    payment-timeout-minutes: 0.03333333333333333
  mq:
    # ⚠️ 这个测试**必须**打开 MQ：它验证的正是"延迟消息真的会到期并触发取消"
    enabled: true
    # 2 秒。测试等它 ── 这就是把"15 分钟"变成"2 秒"的地方。
    # ⚠️ 必须与上面的 payment-timeout-minutes 对齐，否则时限校验会拦住自动取消。
    payment-ttl-millis: 2000
    notify-queue: appointment.notify.queue.test
    delay-queue: appointment.delay.queue.test
    cancel-queue: appointment.cancel.queue.test
    # ⚠️ 交换机名也必须换成 .test —— 只隔离队列是不够的。
    #
    # 原来这三个是硬编码常量，于是测试消息经过**共享交换机**，
    # 而那个交换机上同时绑着 dev 队列与 .test 队列：
    # 一条测试消息被路由到**两个地方**，dev 队列里于是堆满测试消息。
    #
    # 实测：跑一遍全量测试，dev 的 notify/cancel 队列会多出十几条
    # "超时测试医生"的消息。功能不受影响，但演示时要打开管理台看这几个队列——
    # 一堆测试消息会把真正要讲的三个队列淹掉。
    appointment-exchange: appointment.exchange.test
    delay-exchange: appointment.delay.exchange.test
    dead-letter-exchange: appointment.dlx.test

logging:
  level:
    root: WARN
    com.demo.hospital: INFO
    # ⚠️ 排查本测试的偶发失败时把这里临时调到 DEBUG 很有用——
    #    能直接看到"投递 → 死信转发 → 消费"三段日志各自有没有发生。
    #    平时保持 WARN，避免刷屏。
    org.springframework.amqp: WARN
