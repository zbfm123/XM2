# ===================================================================
# 医院预约挂号系统 · Nginx 完整配置（监听 8080）
#
# ⚠️ 这份文件是 deploy/nginx/nginx.conf 的**改端口版**：
#    除了 `listen 80` → `listen 8080`，其余逐行一致。
#
# 为什么需要它：
#   本机 **80 端口被 `Steam++.Accelerator` 占用**（实测 PID 会变，进程名不变），
#   `listen 80` 直接启动失败：
#       bind() to 0.0.0.0:80 failed (10013: An attempt was made to access
#       a socket in a way forbidden by its permissions)
#   在演示现场不方便关掉那个程序时，直接用这份配置，
#   访问 http://localhost:8080 —— 功能完全一样（同一份 server 块）。
#
# 用法：
#   cd D:\nginx\nginx-1.22.0-web\nginx-1.22.0-web
#   .\nginx.exe -c D:/xmdeepseek/hospital-appointment/deploy/nginx/nginx.8080.conf
#
# 已验证（2026-10-05）：首页 200、深层路由回退 200、/api 代理 200、
# 后端不可达时正确返回 502。详见 docs/PROGRESS.md 的 T-017 记录。
# ===================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    access_log  logs/hospital-access.log;
    error_log   logs/hospital-error.log warn;

    server {
        listen       8080;
        server_name  localhost;
        charset utf-8;

        location / {
            root   D:/xmdeepseek/hospital-appointment/frontend/dist;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_buffering off;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8081/api/health;
            access_log off;
        }
    }
}
