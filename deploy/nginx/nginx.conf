# ===================================================================
# 医院预约挂号系统 · Nginx 完整配置（监听 80）—— 验收 A-09
#
# 这是一份**可以直接 -c 使用**的完整配置（自带 events/http 上下文），
# 不是需要你自己嵌进 nginx.conf 的 server 片段。
#
# ── 用法 ─────────────────────────────────────────────────────────────
#   1) 构建前端（T-013~T-016 完成后）：
#        cd D:\xmdeepseek\hospital-appointment\frontend
#        npm.cmd run build                     # 产物在 frontend\dist
#      ⚠️ 前端未开始前，frontend\dist 里放着一个占位页，也能跑通本配置。
#
#   2) 启动后端（端口 8081）：见 README 第四节
#
#   3) 启动 Nginx：
#        cd D:\nginx\nginx-1.22.0-web\nginx-1.22.0-web
#        .\nginx.exe -c D:/xmdeepseek/hospital-appointment/deploy/nginx/nginx.conf
#
#   4) 浏览器打开 http://localhost
#
# ── ⚠️ 本机的端口阻塞（一定要先看这一条）─────────────────────────────
#   本机 **80 端口被 `Steam++.Accelerator` 占用**，直接起会失败并报：
#       bind() to 0.0.0.0:80 failed (10013: ...)
#   二选一：
#     a) 关掉那个加速器，用本文件（listen 80）；
#     b) 不方便关就用同目录的 nginx.8080.conf（**只改了 listen 端口**，其余逐行一致），
#        访问 http://localhost:8080。
#
# ── ⚠️ mime.types ───────────────────────────────────────────────────
#   include 的路径是相对**本文件所在目录**解析的（不是 nginx prefix），
#   所以这里用 mime.types（与本文件同目录，已随仓库提供），
#   这样配置不依赖 nginx 安装目录里有没有那个文件。
# ===================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 日志与临时目录用相对路径时，是相对 nginx 的 prefix（即 nginx.exe 所在目录）。
    # 这里显式写成 nginx 目录下的 logs/，避免误以为写到了项目里。
    access_log  logs/hospital-access.log;
    error_log   logs/hospital-error.log warn;

    # -----------------------------------------------------------------
    # 站点
    # -----------------------------------------------------------------
    server {
        listen       80;
        server_name  localhost;

        # 页面与接口都是 UTF-8，避免中文乱码
        charset utf-8;

        # -------------------------------------------------------------
        # 前端静态资源
        #
        # root 用**正斜杠**：Nginx 配置里反斜杠是转义字符，
        # 写成 D:\xmdeepseek\... 会被解析坏。
        # -------------------------------------------------------------
        location / {
            root   D:/xmdeepseek/hospital-appointment/frontend/dist;
            index  index.html;

            # ⚠️ 这一行是必须的，不是可选项。
            # Vue 的 history 路由下，用户在 /appointments 这类路径按刷新，
            # 浏览器会直接向 Nginx 要 /appointments —— 磁盘上没有这个文件，
            # 默认会 404。fallback 到 index.html 让**前端路由**接管。
            # 少了它，只有首页能刷新，其它页面一刷新就 404（演示时非常显眼）。
            try_files $uri $uri/ /index.html;
        }

        # -------------------------------------------------------------
        # 后端接口反向代理
        #
        # ⚠️ proxy_pass 结尾**没有**多余的 `/`。
        #    写成 `proxy_pass http://127.0.0.1:8081/;` 会剥掉 /api 前缀，
        #    后端收到 /auth/login 而不是 /api/auth/login，直接 404。
        #    不带 URI 的写法原样转发完整路径，正是我们要的。
        # -------------------------------------------------------------
        location /api/ {
            proxy_pass http://127.0.0.1:8081;

            # 把真实来源信息传给后端，否则后端日志里只有 Nginx 的地址
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;

            # ⚠️ 刻意**不**缓存接口响应：
            #    挂号和取消是写操作，被缓存会导致"取消了但页面还是原状态"。
            proxy_buffering off;
        }

        # -------------------------------------------------------------
        # 健康检查别名（给探活用）
        # -------------------------------------------------------------
        location = /health {
            proxy_pass http://127.0.0.1:8081/api/health;
            access_log off;
        }
    }
}
